[project]
name = "whale-listen"
version = "0.2.0"
description = "Ears for AI — count the notes, and draw the sounds that have none"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "basic-pitch>=0.3.0",
    "onnxruntime>=1.16.0",
    "pretty-midi>=0.2.10",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.scripts]
whale-listen = "whale_listen:main"
whale-see = "whale_see:main"
